<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ví Gọn</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, sans-serif; background: linear-gradient(160deg, #0B8A8F, #075E62); color: #fff; text-align: center; }
  .box { padding: 32px 24px; max-width: 320px; }
  .ico { font-size: 56px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { opacity: .85; line-height: 1.5; margin: 0 0 24px; }
  button { border: 0; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 600; background: #fff; color: #0B8A8F; }
</style>
</head>
<body>
<div class="box">
  <div class="ico">📡</div>
  <h1>Không có kết nối mạng</h1>
  <p>Ví Gọn cần mạng để lấy số liệu. Bật Wi-Fi hoặc 4G rồi thử lại nhé.</p>
  <button onclick="location.href='https://walletapps-zeta.vercel.app'">Thử lại</button>
</div>
</body>
</html>
